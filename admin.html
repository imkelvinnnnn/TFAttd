<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF Attendance Admin</title>
    <br/>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffebee;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #d32f2f;
            text-align: center;
            margin-bottom: 5px;
        }

        .date-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid #ffcdd2;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #b71c1c;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .person-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            transition: all 0.3s ease;
        }

        .person-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .mark-btn {
            padding: 8px 16px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .mark-btn:active {
            background-color: #b71c1c;
        }

        .empty-state {
            text-align: center;
            color: #2e7d32;
            font-size: 18px;
            font-weight: bold;
            display: none;
            padding: 20px;
        }

        .loader {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btns button {
            flex: 1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>TF Attendance Admin</h1>
        <br/>
        <div class="date-section">
            <label for="adminDate">选择日期 Select Date:</label>
            <input type="date" id="adminDate" onchange="handleDateChange()">
        </div>

        <div class="action-btns">
            <button onclick="markAllAbsent()" style="background: #607d8b;">Mark Absent (0)</button>
            <button id="statsBtn" onclick="generateStats()" style="background: #1976d2;">Generate Stats</button>
        </div>

        <div id="statsBox" style="display:none; background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bbdefb;">
            <h3 style="margin-top: 0; color: #0d47a1;">
                📊 <span id="displayDate"></span> 少年团出席人数
            </h3>
            <p>出席人数: <strong id="statTotal">0</strong><br />
                少年人: <strong id="statTeens">0</strong><br />
                志工和导师: <strong id="statMentors">0</strong></p>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <h1>⚠️ Missing List</h1>
        <p class="subtitle" id="countDisplay">Checking...</p>

        <div id="loader" class="loader">Loading data...</div>
        <div id="emptyState" class="empty-state">🎉 Everyone is present!</div>
        <div id="listContainer" class="list-container"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqGl_u5uGICQ6kB_uUDveGLCL7MQW_WahwYE5yTDNBX71P6CJRScTOGom_zeCDYHe-sw/exec";
        const MENTOR_NAMES = ["朱芯薇", "陈学睿", "黄佩盈", "林旻震", "李靖言", "朱芷薇", "杨晋恩", "蔡正安", "周凯荣", "张悠扬", "姚菀婷", "朱凯仪", "陈昭傧", "姚杰恒", "徐铭美"];

        window.onload = function () {
            // Initialize Date Picker to Today
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            
            const dateInput = document.getElementById("adminDate");
            dateInput.value = `${year}-${month}-${day}`;
            
            updateDisplayDate();
            loadMissingList();
        };

        function handleDateChange() {
            updateDisplayDate();
            document.getElementById("statsBox").style.display = "none"; // Hide old stats
            loadMissingList();
        }

        function updateDisplayDate() {
            const dateVal = document.getElementById("adminDate").value;
            if (!dateVal) return;
            const [y, m, d] = dateVal.split('-');
            document.getElementById("displayDate").innerText = `${parseInt(d)}/${parseInt(m)}/${y}`;
        }

        function loadMissingList() {
            const selectedDate = document.getElementById("adminDate").value;
            const container = document.getElementById("listContainer");
            const loader = document.getElementById("loader");
            const emptyState = document.getElementById("emptyState");
            const countDisplay = document.getElementById("countDisplay");

            loader.style.display = "block";
            container.innerHTML = "";
            emptyState.style.display = "none";
            countDisplay.innerText = "Checking...";

            fetch(`${SCRIPT_URL}?action=getMissing&date=${selectedDate}`)
                .then(response => response.json())
                .then(data => {
                    loader.style.display = "none";
                    if (data.result === "error") {
                        alert("Error: " + data.message);
                        countDisplay.innerText = "Error loading list";
                        return;
                    }
                    renderList(data.data);
                })
                .catch(err => {
                    loader.style.display = "none";
                    alert("Connection Failed");
                });
        }

        function renderList(names) {
            const container = document.getElementById("listContainer");
            const countDisplay = document.getElementById("countDisplay");
            const emptyState = document.getElementById("emptyState");

            countDisplay.innerText = names.length + " people outstanding";

            if (names.length === 0) {
                emptyState.style.display = "block";
                return;
            }

            names.forEach(name => {
                let card = document.createElement("div");
                card.className = "person-card";
                card.id = "card-" + name;

                let nameSpan = document.createElement("span");
                nameSpan.className = "person-name";
                nameSpan.innerText = name;

                let btn = document.createElement("button");
                btn.className = "mark-btn";
                btn.innerText = "Mark Present";
                btn.onclick = function () { markPerson(name, btn); };

                card.appendChild(nameSpan);
                card.appendChild(btn);
                container.appendChild(card);
            });
        }

        function markPerson(name, btnElement) {
            const selectedDate = document.getElementById("adminDate").value;
            if (!confirm(`Mark ${name} as Present for ${selectedDate}?`)) return;

            btnElement.innerText = "...";
            btnElement.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `name=${encodeURIComponent(name)}&date=${selectedDate}`
            })
            .then(() => {
                const card = document.getElementById("card-" + name);
                card.style.opacity = "0";
                setTimeout(() => {
                    card.remove();
                    updateCount();
                }, 300);
            })
            .catch(err => {
                alert("Failed to mark attendance.");
                btnElement.innerText = "Mark Present";
                btnElement.disabled = false;
            });
        }

        function updateCount() {
            const countDisplay = document.getElementById("countDisplay");
            const remaining = document.querySelectorAll(".person-card").length;

            if (remaining <= 0) {
                countDisplay.innerText = "0 people outstanding";
                document.getElementById("emptyState").style.display = "block";
            } else {
                countDisplay.innerText = remaining + " people outstanding";
            }
        }

        function markAllAbsent() {
            const selectedDate = document.getElementById("adminDate").value;
            if (!confirm(`Mark everyone remaining as absent (0) for ${selectedDate}?`)) return;

            fetch(`${SCRIPT_URL}?action=markAbsent&date=${selectedDate}`)
                .then(r => r.json())
                .then(data => {
                    if (data.result === "success") {
                        alert(`Success: All marked absent for ${selectedDate}`);
                        loadMissingList();
                    } else {
                        alert("Error: " + data.message);
                    }
                });
        }

        function generateStats() {
            const selectedDate = document.getElementById("adminDate").value;
            const btn = document.getElementById("statsBtn");
            const mentorParams = encodeURIComponent(MENTOR_NAMES.join(","));

            btn.innerText = "Loading...";
            btn.disabled = true;

            fetch(`${SCRIPT_URL}?action=getStats&date=${selectedDate}&mentors=${mentorParams}`)
                .then(r => r.json())
                .then(data => {
                    if (data.result === "success") {
                        document.getElementById("statsBox").style.display = "block";
                        document.getElementById("statTotal").innerText = data.total;
                        document.getElementById("statTeens").innerText = data.teens;
                        document.getElementById("statMentors").innerText = data.mentors;
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(err => alert("Could not generate stats."))
                .finally(() => {
                    btn.innerText = "Generate Stats";
                    btn.disabled = false;
                });
        }
    </script>

</body>
</html>
